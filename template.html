/*SITE_CSS*/
/* Overview: one large panel per mod, its picture on top, linking to its guide. */
.brand h1 .docs { color: var(--muted); font-weight: 600; margin-left: 0.25em; }
.mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: 1.25rem; padding-block: 1rem 3rem; }
.mod-card {
  display: flex; flex-direction: column; color: var(--ink); text-decoration: none; overflow: hidden;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
}
.mod-card:hover, .mod-card:focus-visible { border-color: var(--tile); box-shadow: 0 0 0 1px var(--tile); }
.mod-card img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--paper); }
.mod-card .text { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; flex-wrap: wrap; padding: 1rem 1.25rem 1.2rem; }
.mod-card h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.3rem); line-height: 1; margin: 0; }
.mod-card p { margin: 0; color: var(--muted); font-size: 1.05rem; }
</style>
