<title>Waste Industry Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%236d7a2e'/%3E%3Ctext x='32' y='49' text-anchor='middle' font-family='Arial Narrow,Arial,sans-serif' font-weight='700' font-size='48' fill='%23ffffff'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*SITE_CSS*/
/* Layout: sticky settings bar with rules, climate and year; below it the parts of the guide as tiles on the left
   (as the subsidies on the Subsidies+ page) and the chosen part on the right. */
:root { --logo-bg: #6d7a2e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --logo-bg: #8a9a3c; } }
:root[data-theme="dark"] { --logo-bg: #8a9a3c; }
.brand h1 .logo { background: var(--logo-bg); }
.tile .icon { background: var(--paper); overflow: hidden; }
.tile .icon img { width: 100%; height: 100%; object-fit: cover; }
.tile .icon img.glyph { width: 2.25rem; height: 2.25rem; object-fit: contain; }
.tile .icon.mark { background: var(--tile); color: var(--tile-ink); font-family: var(--display); font-weight: 700; font-size: 1.7rem; }
.tile .icon.mark svg { width: 1.8rem; height: 1.8rem; }
/* Quickstart: what the mod changes, before the steps */
.about { display: flex; flex-direction: column; gap: 0.5rem; border-left: 4px solid var(--tile); background: var(--paper); border-radius: 6px; padding: 0.8rem 1rem; }
.about p { margin: 0; }
.about .big { font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.2; }
.about .recipe img { width: 1.5rem; height: 1.5rem; }
/* Settings */
.setting { display: flex; flex-direction: column; gap: 0.5rem; }
.setting h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; }
.setting h3 .where { font-family: var(--body); font-weight: 400; font-size: 0.9rem; color: var(--muted); }
.setting p { margin: 0; }
.values { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
.values li { padding: 0.45rem 0.7rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.values li b { font-family: var(--display); font-size: 1.05rem; margin-right: 0.4rem; }
.values li.chosen { border-color: var(--tile); box-shadow: inset 0 0 0 1px var(--tile); }
.values small { color: var(--muted); }
.detail .lead { margin: 0; color: var(--muted); }
.part-title { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 4.5vw, 2.4rem); line-height: 1; margin: 0; }
.part-sub { font-family: var(--display); font-weight: 700; font-size: 1.25rem; margin: 0 0 0.4rem; }

/* Quickstart: numbered steps */
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.75rem; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { counter-increment: step; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
.steps li::before { content: counter(step); font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1; color: var(--tile); }
.steps h3 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.15; margin: 0; }
.steps p { margin: 0; }
.steps small, .chain small { color: var(--muted); font-size: 0.86rem; display: block; }
.steps li.later { border-style: dashed; }

/* Chains: stages left to right, wrapping on narrow screens */
.chains { display: flex; flex-direction: column; gap: 1rem; }
.chain { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 0.9rem 1rem 1rem; }
.chain h3 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; margin: 0 0 0.6rem; }
.chain .flow + .flow { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--rule); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.flow .arrow { color: var(--muted); font-size: 1.2rem; }
.stage { display: flex; flex-direction: column; gap: 0.35rem; }
.node {
  display: inline-flex; align-items: center; gap: 0.45rem; min-height: 2.4rem; padding: 0.25rem 0.65rem 0.25rem 0.35rem;
  border: 1px solid var(--rule); border-radius: 7px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 500;
}
a.node:hover, a.node:focus-visible { border-color: var(--tile); }
.node img { width: 1.9rem; height: 1.9rem; object-fit: contain; }
.node img.thumb { width: 2.9rem; height: 1.8rem; object-fit: cover; border-radius: 4px; }
.node.base { border-style: dashed; }
.node.cargo { border-color: var(--task); }
.node.off { opacity: 0.4; }
.node .why { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
.branches { display: flex; flex-direction: column; gap: 0.4rem; }
.branch { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }

/* Buildings: a strip of pictures to pick one, its details below */
.bstrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 0.5rem; }
.bpick {
  display: flex; flex-direction: column; gap: 0.25rem; padding: 0.3rem; font: inherit; font-size: 0.85rem; line-height: 1.2; text-align: left;
  color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer;
}
.bpick img { width: 100%; aspect-ratio: 8 / 5; object-fit: cover; border-radius: 5px; }
.bpick:hover { border-color: var(--tile); }
.bpick[aria-pressed="true"] { border-color: var(--tile); box-shadow: inset 0 0 0 1px var(--tile); font-weight: 600; }
.bpick small { color: var(--muted); font-weight: 400; }
.detail-head .picture { width: 12rem; max-width: 100%; aspect-ratio: 8 / 5; object-fit: cover; border-radius: 8px; border: 1px solid var(--rule); }
.sec.build { --sec: var(--muted); }
.sec.works { --sec: var(--task); }
.sec.stations { --sec: var(--upfront); }
.sec.know { --sec: var(--good); }
.sec.build li::before, .sec.stations li::before { content: "•"; color: var(--muted); }
.sec.works li::before { content: "→"; color: var(--task); }
.sec.know li::before { content: "!"; color: var(--good); }
.recipe { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; }
.recipe img { width: 1.35rem; height: 1.35rem; vertical-align: -0.3em; }
.looks { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.looks figure { margin: 0; display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.85rem; color: var(--muted); }
.looks img { width: 8rem; aspect-ratio: 8 / 5; object-fit: cover; border-radius: 6px; border: 1px solid var(--rule); }
.looks figure.now img { border-color: var(--tile); box-shadow: 0 0 0 1px var(--tile); }

/* Towns */
.rules-list { margin: 0 0 1rem; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.35rem; max-width: 50rem; }
tr.chosen td { background: var(--band-warn); font-weight: 600; }

/* Cargo */
/* Cargo table: wrapping text cells, the cargo name kept on one line */
.cargo-table td { white-space: normal; text-align: left; vertical-align: top; }
.cargo-table th { text-align: left; }
.cargo-table td:first-child { white-space: nowrap; font-weight: 600; }
.cargo-table .recipe { flex-wrap: nowrap; }
.cargo-table tr.off td { opacity: 0.45; }

.trouble { display: flex; flex-direction: column; gap: 1rem; }
.know-list { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.35rem; max-width: 50rem; }
footer a { color: inherit; }
</style>

<!--SITE_NAV-->

<header class="top wrap">
  <div class="brand">
    <h1 aria-label="Waste Industry Docs"><span class="logo" aria-hidden="true">W</span><span aria-hidden="true">aste Industry<span class="docs">Docs</span></span></h1>
    <p class="tagline">Transport Fever 3 mod: street waste bins, landfills, an incinerator and recycling.</p>
  </div>
</header>

<div class="settings" role="region" aria-label="Game settings">
  <div class="wrap">
    <div class="field">
      <span class="label" id="difficulty-label">Town waste rules<span id="risk-tip"></span></span>
      <div class="segmented" role="group" aria-labelledby="difficulty-label" id="difficulty"></div>
    </div>
    <div class="field">
      <span class="label" id="climate-label">Climate</span>
      <div class="segmented" role="group" aria-labelledby="climate-label" id="climate"></div>
    </div>
    <div class="field">
      <label class="label" for="year">Game year</label>
      <div class="year">
        <input type="range" id="year" min="1850" max="2050" step="1" value="1950">
        <output id="year-out" for="year">1950</output>
      </div>
    </div>
  </div>
</div>

<main class="wrap list-detail">
  <nav class="tiles" id="tiles" aria-label="Guide"></nav>
  <article class="detail" id="detail" aria-live="polite"></article>
</main>

<footer class="wrap">
  <p>Waste Industry by darthbane426. Also by darthbane426: <a href="../subsidies-plus/">Subsidies+</a>, fifteen new subsidy types.</p>
</footer>

<script>
/*ICONS*/

// Numbers of the mod (darthbane426_waste_industry). Update them here when the mod changes and rebuild.
const MOD = {
  binReach: 160,          // waste/waste_util.lua BIN_RADIUS, catchment of every bin
  binStock: 30,           // waste_util.lua BIN_CAPACITY
  residentsPerWaste: 16,  // waste_util.lua: 0.0625 waste a year per resident
  jobsPerWaste: 8,        // 0.125 per workplace in shops and industry
  townRulesFrom: 1900,    // waste/town_waste.lua
  presets: [
    { id: "easy", label: "Easy", risk: 0 },
    { id: "normal", label: "Normal", risk: 1 },
    { id: "hard", label: "Hard", risk: 2 },
    { id: "veryhard", label: "Very Hard", risk: 3 },
  ],
  // town_waste.lua RULES by the game's Subsidy risk setting
  townRules: [
    { minPop: 800, stopPop: 1600, maxLoss: 0.5, stopBelow: 0.3, recoverAt: 0.5 },
    { minPop: 500, stopPop: 1000, maxLoss: 0.7, stopBelow: 0.4, recoverAt: 0.6 },
    { minPop: 400, stopPop: 800, maxLoss: 0.75, stopBelow: 0.5, recoverAt: 0.7 },
    { minPop: 300, stopPop: 600, maxLoss: 0.8, stopBelow: 0.6, recoverAt: 0.8 },
  ],
};

const CLIMATES = [
  { id: "temperate", label: "Temperate" },
  { id: "dry", label: "Dry" },
  { id: "subarctic", label: "Subarctic" },
  { id: "tropic", label: "Tropic" },
  { id: "all", label: "All industries" },
];
// Base game industries that take the mod's cargo, and the climates (game economies) that have them.
const BASE = {
  town: { name: "Town buildings", climates: null },
  cement: { name: "Cement plant", climates: ["subarctic", "all"] },
  bricks: { name: "Brick works", climates: ["temperate", "dry", "all"] },
  steel: { name: "Steel mill", climates: null },
  glass: { name: "Glass works", climates: null },
  tools: { name: "Tool factory", climates: null },
  machines: { name: "Machine factory", climates: null },
  paper: { name: "Paper mill", climates: ["subarctic", "all"] },
};
const CARGO = {
  waste: { name: "Waste" },
  recyclables: { name: "Recyclables", from: 1970 },
  bottom_ash: { name: "Bottom ash", from: 1925, climates: ["temperate", "dry", "subarctic", "all"] },
  scrap: { name: "Scrap metal", from: 1970 },
  cullet: { name: "Glass cullet", from: 1970 },
  plastic: { name: "Plastic", from: 1970, base: true },
  waste_paper: { name: "Recovered paper", from: 1970, climates: ["subarctic", "all"] },
};

const el = id => document.getElementById(id);
const tip = (text, end) => `<span class="tip${end ? " end" : ""}"><button type="button" class="tip-btn" aria-label="Explain">i</button><span class="tip-text" role="tooltip">${text}</span></span>`;
const fmt = n => n.toLocaleString("en-US").replace(/,/g, " ");
const pct = x => `${Math.round(x * 100)} %`;
const money = n => `<span class="money">$${fmt(n)}</span>`;
const img = (key, cls) => ICONS[key] ? `<img src="${ICONS[key]}" alt=""${cls ? ` class="${cls}"` : ""}>` : "";
const val = v => typeof v === "function" ? v() : v;

function cargoRef(id) {
  return `<span class="recipe">${img("cargo:" + id)}${CARGO[id].name}</span>`;
}
function recipe(inputs, outputs) {
  const side = list => list.map(([id, n]) => `${n} ${cargoRef(id)}`).join(" + ");
  return `<span class="recipe">${side(inputs)} → ${side(outputs)}</span>`;
}
function wasteRateLine() {
  return `A year: 1 waste per ${MOD.residentsPerWaste} residents, 1 per ${MOD.jobsPerWaste} workplaces in shops and industry.<small>A building within reach of several bins counts only for the nearest one.</small>`;
}
function fullBinLines() {
  return [`Full at ${MOD.binStock} waste: it stops collecting, stinks and pollutes the street, and flies appear. Empty it often enough.`];
}
// Buildings of the mod. looks: menu pictures by era (yearTo exclusive); the tile shows the look of the chosen year.
const BUILDINGS = [
  {
    id: "waste_bin", name: "Waste bin", pitch: "Collects the waste of the buildings around it.",
    looks: [{ icon: "waste_bin_old", to: 1920 }, { icon: "waste_bin_mid", from: 1920, to: 1980 }, { icon: "waste_bin_new", from: 1980 }],
    cost: 20000, upkeep: 2000,
    works: [`Collects ${cargoRef("waste")} from the buildings within ${MOD.binReach} m.`, wasteRateLine()],
    stations: ["Trucks load here; it sits on one side of the street, at least 10 m from a crossing."],
    know: fullBinLines(),
  },
  {
    id: "recycling_bin", name: "Recycling bin", pitch: "Half of the waste comes out as recyclables.", from: 1970,
    looks: [{ icon: "recycling_bin", from: 1970 }],
    cost: 30000, upkeep: 3000,
    works: [`Collects half as ${cargoRef("waste")} and half as ${cargoRef("recyclables")} from the buildings within ${MOD.binReach} m.`, wasteRateLine()],
    stations: ["Trucks load both cargos here; same street placement as the waste bin."],
    know: [...fullBinLines(), "Both cargos must be collected: when either is full, the bin stops filling."],
  },
  {
    id: "waste_stop", name: "Street stop with waste bins", pitch: "A passenger street stop with waste bins.",
    looks: [{ icon: "waste_stop_old", to: 1920 }, { icon: "waste_stop_mid", from: 1920, to: 1980 }, { icon: "waste_stop_new", from: 1980 }],
    cost: 50000, upkeep: 7000,
    works: [`Collects ${cargoRef("waste")} like a waste bin, within ${MOD.binReach} m.`, "Passengers board and alight as at a small street stop."],
    stations: ["One stop for passenger lines and waste trucks."],
    know: fullBinLines(),
  },
  {
    id: "recycling_stop", name: "Street stop with recycling bins", pitch: "A street stop with recycling bins.", from: 1970,
    looks: [{ icon: "recycling_stop_mid", from: 1970, to: 1980 }, { icon: "recycling_stop_new", from: 1980 }],
    cost: 60000, upkeep: 8000,
    works: [`Collects half as ${cargoRef("waste")} and half as ${cargoRef("recyclables")}, within ${MOD.binReach} m.`, "Passengers board and alight as at a small street stop."],
    stations: ["One stop for passenger lines and waste trucks."],
    know: [...fullBinLines(), "Both cargos must be collected: when either is full, the bins stop filling."],
  },
  {
    id: "landfill_small", name: "Landfill", pitch: "Buries waste; the heap grows as it fills.",
    looks: [{ icon: "landfill_small" }],
    cost: 150000,
    works: [`Takes ${cargoRef("waste")} and buries it; the waste slowly disappears.`, "Holds up to 1 000 waste.", "10 workers; with them the waste disappears 1.5× faster."],
    stations: ["One truck stop.", "Snaps to a road, or is placed freely (option in the build menu)."],
    know: ["Cannot be demolished while it holds waste.", "Pollutes its surroundings all the time."],
  },
  {
    id: "landfill_large", name: "Large landfill", pitch: "Two truck stops and room for a far bigger heap.",
    looks: [{ icon: "landfill_large" }],
    cost: 250000,
    works: [`Takes ${cargoRef("waste")} and buries it; the waste slowly disappears.`, "Holds up to 2 500 waste.", "20 workers; with them the waste disappears 2× faster."],
    stations: ["Two truck stops.", "Snaps to a road, or is placed freely (option in the build menu)."],
    know: ["Cannot be demolished while it holds waste.", "Pollutes its surroundings more than the small landfill, all the time."],
  },
  {
    id: "incinerator", name: "Waste Incinerator", pitch: "Burns waste into bottom ash for building materials.", from: 1925,
    looks: [{ icon: "incinerator", from: 1925 }],
    cost: 350000,
    works: [() => tropic() ? `Burns 2 ${cargoRef("waste")}; in the tropic climate nothing is left to haul.` : recipe([["waste", 2]], [["bottom_ash", 1]]),
      () => tropic() ? "Holds up to 800 waste." : "Holds up to 800 waste and 400 bottom ash.", "30 workers; with them it burns 2× faster."],
    stations: [() => tropic() ? "Two truck stops for waste in the hall." : "Two truck stops for waste in the hall, one for bottom ash.", "Two train tracks, for trains up to 85 m.", "Placed freely."],
    know: ["Pollutes heavily while it burns, little when idle.", () => tropic() ? "" : "Bottom ash that nobody takes fills the store and stops the burning."],
  },
  {
    id: "sorting_plant", name: "Sorting Plant", pitch: "Turns recyclables into raw materials.", from: 1970,
    looks: [{ icon: "sorting_plant", from: 1970 }],
    cost: 300000,
    works: [() => paperClimate()
      ? recipe([["recyclables", 5]], [["scrap", 1], ["cullet", 1], ["plastic", 1], ["waste_paper", 1], ["waste", 1]])
      : recipe([["recyclables", 4]], [["scrap", 1], ["cullet", 1], ["plastic", 1], ["waste", 1]]),
      "Holds up to 800 recyclables and 200 of each product.", "30 workers; with them it sorts 2× faster."],
    stations: ["Two truck stops for recyclables, two for the products.", "Two train tracks, for trains up to 110 m.", "Placed freely."],
    know: ["Every product, the waste too, must be hauled away: when one is full, sorting stops.", () => paperClimate() ? "In this climate it also makes recovered paper for paper mills." : "Recovered paper only in the subarctic climate and with all industries.", "The waste it leaves goes to a landfill or the incinerator."],
  },
];

const TIP = {
  risk: "Mod setting: the gear icon next to the mod in the mod list.",
  coverage: "Share of the town's waste made by buildings within reach of a bin. Shops and industry make twice as much waste per person as homes.",
};

const state = { risk: 1, climate: "temperate", year: 1950, part: "quickstart", open: BUILDINGS[0].id };

const paperClimate = () => ["subarctic", "all"].includes(state.climate);
const tropic = () => state.climate === "tropic";
const rules = () => MOD.townRules[state.risk];

// Whether an item is missing in the chosen climate; the reason if so.
const missingInClimate = item => item.climates && !item.climates.includes(state.climate) ? "not in this climate" : "";
// Label of a node in the chains: missing in the climate, or the year from which it exists.
const nodeNote = item => missingInClimate(item) || (item.from ? `from ${item.from}` : "");
const building = id => BUILDINGS.find(b => b.id === id);
const lookFor = b => b.looks.find(l => (!l.from || state.year >= l.from) && (!l.to || state.year < l.to)) || b.looks[b.looks.length - 1];

// ---- Quickstart

function quickstartHtml() {
  const r = rules();
  const steps = [
    {
      title: "Build a landfill",
      text: "Road → Waste → Landfill. Outside the town, next to a road; it has its own truck stop.",
      note: "Once it holds waste it cannot be demolished until it is empty: leave room for the town to grow.",
    },
    {
      title: "Put waste bins in town",
      text: `Road → Waste → Waste bin, along the streets. Each collects from the buildings within ${MOD.binReach} m.`,
      note: `A bin serves one side of the street. From ${MOD.townRulesFrom}, towns of more than ${fmt(r.minPop)} inhabitants need bins.`,
    },
    { title: "Run a truck line", text: "Bins → landfill, with bulk or universal trucks. Several bins can share one line.", note: "Waste pays like any cargo." },
    {
      title: "Check that it works",
      text: "Trucks load at the bins and unload at the landfill. A bin's window shows its waste a year and its store.",
      note: `A full bin (${MOD.binStock} waste) stinks and pollutes the street: add trucks or bins.`,
    },
    {
      title: "Watch the Waste card",
      text: "The town window shows how much of the town's waste your bins reach.",
      note: "It counts reach, not collection: a full bin still counts, but pollutes.",
    },
    {
      title: "Later: burn and recycle",
      text: "The incinerator burns waste, outside the tropic climate into bottom ash for cement and bricks. Recycling bins and the sorting plant make raw materials.",
      note: "Incinerator from 1925, recycling from 1970.",
      later: true,
    },
  ];
  const about = `<div class="about">
      <p class="big">Towns now make ${cargoRef("waste")}. From 1970 recycling bins also collect ${cargoRef("recyclables")}.</p>
      <p>Collect it with street bins and trucks and take it to a landfill, an incinerator or, sorted, to a sorting plant that makes raw materials.</p>
      <small>A big town without enough bins loses reputation and grows slower, or stops growing.</small>
    </div>`;
  return `${about}<ol class="steps">${steps.map(s =>
    `<li${s.later ? ' class="later"' : ""}><h3>${s.title}</h3><p>${s.text}</p><small>${s.note}</small></li>`).join("")}</ol>
    <div><h3 class="part-sub">Good to know</h3><ul class="know-list">
      <li>The game's "Supply Industry" subsidy never picks a landfill, the incinerator or a sorting plant as its target.</li>
      <li>The mod changes saved games for good (new cargo, bins, landfills). Removing it from a save breaks the save.</li>
    </ul></div>`;
}

// ---- Chains

const nodeTail = item => {
  const note = nodeNote(item);
  return note ? ` <span class="why">${note}</span>` : "";
};
const nodeBuilding = id => {
  const b = building(id);
  return `<a class="node${missingInClimate(b) ? " off" : ""}" href="#b-${id}" data-open="${id}">${img("build:" + lookFor(b).icon, "thumb")}${b.name}${nodeTail(b)}</a>`;
};
const nodeCargo = id => {
  const c = CARGO[id];
  return `<a class="node cargo${missingInClimate(c) ? " off" : ""}" href="#cargo" data-part="cargo">${img("cargo:" + id)}${c.name}${nodeTail(c)}</a>`;
};
const nodeBase = id => {
  const b = BASE[id];
  return `<span class="node base${missingInClimate(b) ? " off" : ""}">${b.name}${nodeTail(b)}</span>`;
};
const stage = nodes => `<div class="stage">${nodes.join("")}</div>`;
const arrow = '<span class="arrow" aria-hidden="true">→</span>';
const flow = (...stages) => `<div class="flow">${stages.join(arrow)}</div>`;

function chainsHtml() {
  const chains = [
    {
      title: "Waste",
      body: flow(stage([nodeBase("town")]), stage([nodeBuilding("waste_bin"), nodeBuilding("waste_stop")]), stage([nodeCargo("waste")]),
        stage([nodeBuilding("landfill_small"), nodeBuilding("landfill_large"), nodeBuilding("incinerator")])),
    },
    {
      title: "Bottom ash",
      body: flow(stage([nodeBuilding("incinerator")]), stage([nodeCargo("bottom_ash")]), stage([nodeBase("cement"), nodeBase("bricks")]))
        + `<small>Cement plants and brick works take bottom ash instead of stone or clay; with both they make more. In the tropic climate the incinerator only burns waste.</small>`,
    },
    {
      title: "Recycling",
      body: flow(stage([nodeBase("town")]), stage([nodeBuilding("recycling_bin"), nodeBuilding("recycling_stop")]), stage([nodeCargo("recyclables")]), stage([nodeBuilding("sorting_plant")]),
        `<div class="branches">${[
          ["scrap", ["steel"]], ["cullet", ["glass"]], ["plastic", ["tools", "machines"]], ["waste_paper", ["paper"]],
        ].map(([cargo, to]) => `<div class="branch">${nodeCargo(cargo)}${arrow}${to.map(nodeBase).join("")}</div>`).join("")
        }<div class="branch">${nodeCargo("waste")}${arrow}${nodeBuilding("landfill_small")}${nodeBuilding("incinerator")}</div></div>`)
        + flow(stage([nodeBuilding("recycling_bin"), nodeBuilding("recycling_stop")]), stage([nodeCargo("waste")]), stage([nodeBuilding("landfill_small"), nodeBuilding("incinerator")]))
        + `<small>Half of what recycling bins collect is ordinary waste, the other half recyclables. Steel mills take scrap instead of iron ore (coal is still needed), glass works cullet instead of sand, paper mills recovered paper instead of sawdust.</small>`,
    },
  ];
  return `<div class="chains">${chains.map(c => `<div class="chain"><h3>${c.title}</h3>${c.body}</div>`).join("")}</div>`;
}

// ---- Buildings

function section(cls, title, items) {
  return `<section class="sec ${cls}"><h3>${title}</h3><ul>${items.map(val).filter(Boolean).map(i => `<li>${i}</li>`).join("")}</ul></section>`;
}

function buildingsHtml() {
  const strip = `<div class="bstrip" role="group" aria-label="Buildings">${BUILDINGS.map(b =>
    `<button type="button" class="bpick" data-open="${b.id}" aria-pressed="${b.id === state.open}">${img("build:" + lookFor(b).icon)}${b.name}${b.from ? `<small>from ${b.from}</small>` : ""}</button>`).join("")}</div>`;
  const b = building(state.open);
  const look = lookFor(b);
  const years = b.looks.length > 1
    ? `<div class="looks">${b.looks.map(l => `<figure${l === look ? ' class="now"' : ""}>${img("build:" + l.icon)}<figcaption>${l.from || ""}${l.from || l.to ? "–" : ""}${l.to || ""}</figcaption></figure>`).join("")}</div>`
    : "";
  const build = [
    `Price ${money(b.cost)}${b.upkeep ? `, upkeep ${money(b.upkeep)} a year` : ""}`,
    b.from ? `Available from ${b.from}.` : "Available from the start.",
  ];
  return `${strip}
    <div class="detail-head">
      <img class="picture" src="${ICONS["build:" + look.icon] || ""}" alt="">
      <div class="title"><h3 class="part-title">${b.name}</h3><p>${b.pitch}</p></div>
    </div>
    ${years}
    <div class="sections">
      ${section("build", "Build", build)}
      ${section("works", "What it does", b.works)}
      ${section("stations", "Stations", b.stations)}
      ${section("know", "Good to know", b.know)}
    </div>`;
}

// ---- Towns

function townsHtml() {
  const r = rules();
  const lines = [
    `From ${MOD.townRulesFrom}, a town of more than <strong>${fmt(r.minPop)}</strong> inhabitants needs waste bins.`,
    `What counts is the <strong>coverage</strong>${tip(TIP.coverage)}: how much of the town's waste your bins reach. A full bin still counts, but it stinks.`,
    `Too little coverage costs reputation, at most ${pct(r.maxLoss)}, and the town grows slower.`,
    `Above <strong>${fmt(r.stopPop)}</strong> inhabitants and below <strong>${pct(r.stopBelow)}</strong> coverage the town stops growing, until coverage is back at ${pct(r.recoverAt)}.`,
    "Lost reputation comes back slowly, as after a failed subsidy.",
    "With Reputation switched off in the game settings, waste does not affect town growth.",
    'The town window has a "Waste" card: the coverage rating, the waste a year, the number of bins and how growth is affected.',
  ];
  return `<ul class="rules-list">${lines.map(t => `<li>${t}</li>`).join("")}</ul>
    <div class="table-scroll"><table><thead><tr><th>Town waste rules</th><th>Bins needed above</th><th>Max. reputation loss</th><th>Growth stops above</th><th>… below coverage</th><th>Recovers at</th></tr></thead><tbody>${
      MOD.townRules.map((t, i) => `<tr${i === state.risk ? ' class="chosen"' : ""}><td>${MOD.presets[i].label}</td><td>${fmt(t.minPop)}</td><td>${pct(t.maxLoss)}</td><td>${fmt(t.stopPop)}</td><td>${pct(t.stopBelow)}</td><td>${pct(t.recoverAt)}</td></tr>`).join("")
    }</tbody></table></div>`;
}

// ---- Cargo

function cargoHtml() {
  const rows = [
    ["waste", "Waste bins and stops, recycling bins and stops, Sorting Plant", "Landfills, Waste Incinerator", ""],
    ["recyclables", "Recycling bins and stops", "Sorting Plant", "From 1970"],
    ["bottom_ash", "Waste Incinerator", `${BASE.cement.name}, ${BASE.bricks.name}`, "Instead of stone or clay. Cement plant: subarctic; brick works: temperate, dry. Not made in the tropic climate."],
    ["scrap", "Sorting Plant", "Steel mill", "Instead of iron ore; coal still needed"],
    ["cullet", "Sorting Plant", "Glass works", "Instead of sand"],
    ["plastic", "Sorting Plant", "Tool factory, machine factory", "The game's own plastic"],
    ["waste_paper", "Sorting Plant", "Paper mill", "Instead of sawdust. Subarctic and all industries only."],
  ];
  return `<div class="table-scroll"><table class="cargo-table"><thead><tr><th>Cargo</th><th>Loaded at</th><th>Taken by</th><th>Notes</th></tr></thead><tbody>${
    rows.map(([id, from, to, note]) => `<tr${missingInClimate(CARGO[id]) ? ' class="off"' : ""}><td><span class="recipe">${img("cargo:" + id)}${CARGO[id].name}</span></td><td>${from}</td><td>${to}</td><td>${note}</td></tr>`).join("")
  }</tbody></table></div>`;
}

const GEAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>';

// ---- Settings

function settingsHtml() {
  const rulesValues = MOD.townRules.map((t, i) => `<li${i === state.risk ? ' class="chosen"' : ""}><b>${MOD.presets[i].label}</b>`
    + `bins needed above ${fmt(t.minPop)} inhabitants; growth stops above ${fmt(t.stopPop)} below ${pct(t.stopBelow)} coverage`
    + `<br><small>Reputation loss at most ${pct(t.maxLoss)}; growth comes back at ${pct(t.recoverAt)} coverage.${i === 1 ? " Default." : ""}</small></li>`).join("");
  return `<div class="setting">
      <h3>Town waste rules <span class="where">mod setting</span></h3>
      <p>How strictly towns demand waste bins.</p>
      <ul class="values">${rulesValues}</ul>
    </div>
    <div class="setting">
      <h3>Waste test mode <span class="where">mod setting, Off by default</span></h3>
      <p>Only for test games: adds test buildings to the menu, writes a report to the game log every month and pauses the game after six months.</p>
    </div>
    <div class="setting">
      <h3>Reputation <span class="where">game setting, new game</span></h3>
      <p>Switched off, waste does not affect town growth. Bins still collect and full bins still pollute.</p>
    </div>
    <div class="setting">
      <h3>Industry productivity <span class="where">game setting, difficulty</span></h3>
      <p>Towns make the same waste at every productivity. Landfills, the incinerator and the sorting plant work faster or slower with it, like other industries.</p>
    </div>
    <div class="setting">
      <h3>Economy <span class="where">game setting, new game</span></h3>
      <p>Decides who takes bottom ash and recovered paper: see Chains with the climate set above.</p>
    </div>`;
}

// ---- Parts of the guide, shown as tiles on the left

const PARTS = [
  { id: "quickstart", name: "Quickstart", pitch: "What the mod does, and your first collection route.", mark: "1", html: quickstartHtml },
  { id: "chains", name: "Chains", pitch: "Where each cargo comes from and goes.", icon: "cargo:waste", glyph: true, html: chainsHtml,
    lead: "Faded: missing in the chosen climate." },
  { id: "buildings", name: "Buildings", pitch: "Bins, landfills, the incinerator, the sorting plant.", icon: "build:incinerator", html: buildingsHtml,
    lead: "All in the build menu under Road → Waste." },
  { id: "towns", name: "Towns and waste", pitch: "What towns expect, and what happens if not.", icon: "build:waste_stop_new", html: townsHtml },
  { id: "cargo", name: "Cargo", pitch: "Six new cargos and who takes them.", icon: "cargo:recyclables", glyph: true, html: cargoHtml,
    lead: "Any bulk or universal truck, wagon or ship carries them." },
  { id: "trouble", name: "Something isn't working", pitch: "What to check when trucks, bins or plants stop.", mark: "?", html: troubleHtml,
    lead: "Find what you see, then go through the checks." },
  { id: "settings", name: "Settings", pitch: "What each setting changes.", mark: GEAR, html: settingsHtml,
    lead: "Mod settings: the gear icon next to the mod in the mod list." },
];

function renderTiles() {
  el("tiles").innerHTML = PARTS.map(p => `<button type="button" class="tile" data-part="${p.id}" aria-expanded="${p.id === state.part}">
      ${p.mark ? `<span class="icon mark" aria-hidden="true">${p.mark}</span>` : `<span class="icon">${img(p.icon, p.glyph ? "glyph" : "")}</span>`}
      <span class="tile-text"><span class="name">${p.name}</span><span class="pitch">${p.pitch}</span></span>
      <span class="chev" aria-hidden="true">›</span></button>`).join("");
}

function renderDetail() {
  const part = PARTS.find(p => p.id === state.part) || PARTS[0];
  el("detail").innerHTML = `<div><h2 class="part-title">${part.name}</h2>${part.lead ? `<p class="lead">${part.lead}</p>` : ""}</div>${part.html()}`;
}

// ---- Settings bar

function renderSettings() {
  el("difficulty").innerHTML = MOD.presets.map(p =>
    `<button type="button" data-risk="${p.risk}" aria-pressed="${p.risk === state.risk}">${p.label}</button>`).join("");
  el("climate").innerHTML = CLIMATES.map(c =>
    `<button type="button" data-climate="${c.id}" aria-pressed="${c.id === state.climate}">${c.label}</button>`).join("");
  el("year-out").textContent = state.year;
}

function render() {
  renderSettings();
  renderTiles();
  renderDetail();
}

// Shows a part (in Buildings also a building), keeps it in the address for links, and brings the details into view
// when they are out of sight (stacked on narrow screens they start below the tiles).
function show(part, buildingId) {
  state.part = part;
  if (buildingId) state.open = buildingId;
  const hash = "#" + (part === "buildings" ? "b-" + state.open : part);
  if (location.hash !== hash) history.pushState(null, "", hash);
  render();
  const detail = el("detail");
  const top = detail.getBoundingClientRect().top;
  if (top < 0 || top > window.innerHeight * 0.6) detail.scrollIntoView({ block: "start" });
}

el("risk-tip").innerHTML = tip(TIP.risk);
el("difficulty").addEventListener("click", e => {
  const button = e.target.closest("button[data-risk]");
  if (!button) return;
  state.risk = Number(button.dataset.risk);
  render();
});
el("climate").addEventListener("click", e => {
  const button = e.target.closest("button[data-climate]");
  if (!button) return;
  state.climate = button.dataset.climate;
  render();
});
el("year").addEventListener("input", e => { state.year = Number(e.target.value); render(); });
el("tiles").addEventListener("click", e => {
  const tile = e.target.closest(".tile");
  if (tile) show(tile.dataset.part);
});
el("detail").addEventListener("click", e => {
  const target = e.target.closest("[data-open], [data-part]");
  if (!target) return;
  e.preventDefault();
  if (target.dataset.open) show("buildings", target.dataset.open);
  else show(target.dataset.part);
});

// Height of the sticky settings bar, for the scroll offset of the details.
const bar = document.querySelector(".settings");
new ResizeObserver(() => document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px")).observe(bar);

// The part (and building) named in the address: #chains, #b-sorting_plant, ...
function readHash() {
  const hash = location.hash.slice(1);
  if (hash.startsWith("b-") && building(hash.slice(2))) {
    state.part = "buildings";
    state.open = hash.slice(2);
  } else {
    state.part = PARTS.some(p => p.id === hash) ? hash : PARTS[0].id;
  }
}
window.addEventListener("popstate", () => { readHash(); render(); });

readHash();
render();
</script>
